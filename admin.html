<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المتابعة — برنامج وورد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=11231608">
<style>
body{overflow:auto;height:auto;min-height:100vh}
.atop{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--side);color:#fff;position:sticky;top:0;z-index:5}
.atop .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#41a5ee,#185abd);display:grid;place-items:center;font:800 20px "Segoe UI",Arial}
.atop b{font-size:18px}.atop .sp{flex:1}.atop a,.atop button{color:#dfe6f2;border:1px solid rgba(255,255,255,.25);background:none;border-radius:9px;padding:6px 12px;font-size:13px;text-decoration:none}
.atabs{display:flex;gap:6px;padding:12px 20px 0;max-width:1200px;margin:0 auto;flex-wrap:wrap}
.atabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font-weight:800;font-size:14.5px;color:var(--mute)}
.atabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.wrap{max-width:1200px;margin:0 auto;padding:16px 20px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
input,select,textarea{font:inherit;font-size:14.5px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
textarea{width:100%;min-height:120px;direction:ltr;text-align:left}
.btn{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:9px 16px;font-weight:800;font-size:14px}.btn.g{background:#eef1f6;color:var(--ink)}.btn.r{background:#fdecec;color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:right;vertical-align:middle}th{background:#f8fafc;font-size:13px;color:var(--mute);position:sticky;top:62px}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;white-space:nowrap}
.c0{background:#f1f3f7;color:#98a2b3}.c1{background:#fff4d6;color:#8a6200}.c2{background:#e7f7ec;color:#137a37}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.tgl b{font-size:15.5px}.sw2{position:relative;width:52px;height:28px;flex:none}.sw2 input{opacity:0;width:0;height:0}.sw2 span{position:absolute;inset:0;background:#d0d5dd;border-radius:99px;transition:.2s;cursor:pointer}.sw2 span::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;right:3px;transition:.2s}
.sw2 input:checked+span{background:var(--ok)}.sw2 input:checked+span::after{right:27px}
.muted{color:var(--mute);font-size:13.5px}.ltr{direction:ltr;text-align:left}
.empty{color:var(--mute);text-align:center;padding:30px}
.pbar{height:7px;background:#eef1f6;border-radius:9px;overflow:hidden;min-width:80px}.pbar i{display:block;height:100%;background:var(--ok)}
.notice{background:var(--goldL);border:1px solid #f1d38a;border-radius:12px;padding:14px;line-height:1.8}
.seg{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:8px 14px;font-weight:800;font-size:14px;color:var(--mute)}.seg button.on{background:#e8f0fe;border-color:var(--blue);color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0 14px}.kpis>div{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;background:#fbfcfe}.kpis b{display:block;font-size:24px}.kpis span{font-size:12.5px;color:var(--mute)}.kpis .k2{background:#e7f7ec}.kpis .k1{background:#fff4d6}.kpis .k0{background:#f1f3f7}
.card2{border:1px solid #f1d38a;background:#fffaf0;border-radius:14px;padding:10px 14px;margin-bottom:14px}.card2 h3{margin:4px 0 8px;font-size:15px}.hrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:7px 4px;border-top:1px solid #f3e3bd;cursor:pointer;font-size:13.5px}.hrow:hover{background:#fff1cf}
a.stu,a.th{color:var(--blue);cursor:pointer;text-decoration:none;font-weight:700}a.stu:hover,a.th:hover{text-decoration:underline}
.card table th{position:static}.card table th.ih{top:0}.tt td:first-child{position:sticky;right:0;background:#fff;z-index:1}.tt tr.foot td:first-child{background:#f8fafc}
.tt td.tc,.tt th.ih{text-align:center;padding:6px 3px;min-width:34px;position:relative}.tt th.gh{text-align:center;background:#eef3fb;color:var(--ink);border-inline:2px solid #fff}
.dot{display:inline-grid;place-items:center;min-width:26px;height:24px;border-radius:7px;font-size:11.5px;font-weight:800;padding:0 3px}.d2{background:#22a35a;color:#fff}.d1{background:#ffe7a3;color:#7a5600}.d0{background:#f1f3f7}
.eye{position:absolute;top:0;left:1px;font-size:10px;font-style:normal}.foot td{background:#f8fafc;font-weight:700}.foot small{color:var(--mute)}
.legend{columns:2;font-size:13.5px;line-height:1.9;margin-top:12px}@media(max-width:700px){.legend{columns:1}}
.mbg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:20;display:grid;place-items:center;padding:14px}.mdl{background:#fff;border-radius:16px;padding:18px;width:min(900px,100%);max-height:90vh;overflow:auto}.mdl h3{margin:16px 0 6px;font-size:16px}
table.mini{font-size:13px}table.mini th{position:static}table.mini tr.r2 td:nth-child(2){color:#137a37;font-weight:800}table.mini tr.r1 td:nth-child(2){color:#8a6200;font-weight:800}
</style>
</head>
<body>
<div id="gate" hidden></div>
<div class="atop"><span class="logo">W</span><b>لوحة المتابعة</b><span class="sp"></span><span id="who" class="muted" style="color:#93a2ba"></span><a href="index.html">فتح الموقع</a><button id="out">خروج</button></div>
<div class="atabs" id="atabs"><button data-v="track" class="on">📊 المتابعة</button><button data-v="unlock">🔓 فتح الدروس</button><button data-v="students">👩‍🎓 الطلاب</button><button data-v="sections">🏫 الشعب</button></div>
<div class="wrap" id="view"></div>
<script src="js/config.js?v=11231608"></script>
<script src="js/topics-meta.js?v=11231608"></script>
<script>
const inSec=(st,id)=>st.section_id===id||(st.extra||[]).includes(id);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const T=(window.ONLY_TOPICS?window.TOPICS_META.filter(t=>ONLY_TOPICS.includes(t.id)):window.TOPICS_META);
const ld=src=>new Promise((r,j)=>{const s=document.createElement('script');s.src=src;s.onload=r;s.onerror=j;document.head.appendChild(s)});
let sb,SEC=[],STU=[],PRO={},view='track',selSec='';
function gateMsg(h){const g=$('#gate');g.hidden=false;g.innerHTML=`<div class="gcard"><div class="glogo">W</div><h1>لوحة المتابعة</h1>${h}</div>`}
async function load(){const [a,b,c]=await Promise.all([sb.from('sections').select('*'),sb.from('students').select('*'),sb.from('progress').select('*')]);
  SEC=(a.data||[]).sort((x,y)=>(x.name||'').localeCompare(y.name||'','ar'));STU=b.data||[];PRO={};(c.data||[]).forEach(r=>PRO[r.email]=r);if(!selSec&&SEC[0])selSec=SEC[0].id;if(selSec&&!SEC.find(x=>x.id===selSec))selSec=SEC[0]?.id||'';render()}
async function init(){
  if(!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY){gateMsg('<div class="notice">لم يتم ربط Supabase بعد.<br>اتبعي خطوات ملف <b>SUPABASE-SETUP.md</b> ثم ضعي الإعدادات في <b>js/config.js</b>.</div>');return}
  await ld('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
  const {data:{session}}=await sb.auth.getSession();
  if(!session){gateMsg('<p>سجّلي الدخول بحساب Google الخاص بالمعلّمة.</p><button class="gbtn" id="gi">تسجيل الدخول بحساب Google</button>');$('#gi').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});return}
  const em=session.user.email.toLowerCase();const ad=await sb.from('admins').select('email').eq('email',em).maybeSingle();
  if(!ad.data){gateMsg(`<div class="gwarn">الحساب <b dir="ltr">${em}</b> ليس حساب المعلّمة.</div><button class="gbtn alt" id="go">خروج</button>`);$('#go').onclick=()=>sb.auth.signOut().then(()=>location.reload());return}
  $('#gate').hidden=true;$('#who').textContent=em;await load();setInterval(()=>{if(view==='track'&&!stuOpen&&!document.querySelector('select:focus'))load()},30000);
}
$('#out').onclick=()=>sb&&sb.auth.signOut().then(()=>location.reload());
$('#atabs').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;view=b.dataset.v;$$('#atabs button').forEach(x=>x.classList.toggle('on',x===b));render()};
const secSel=(id='sec')=>`<select id="${id}">${SEC.map(s=>`<option value="${s.id}" ${s.id===selSec?'selected':''}>${s.name}</option>`).join('')}</select>`;
const secName=id=>SEC.find(s=>s.id===id)?.name||'—';
const ok=r=>{if(r.error){alert('خطأ: '+r.error.message);return false}return true};
function render(){const v=$('#view');
  if(view==='sections'){v.innerHTML=`<div class="card"><h2>الشعب</h2><div class="row"><input id="nsec" placeholder="اسم الشعبة، مثل: التاسع أ"><button class="btn" id="asec">إضافة شعبة</button></div>
    <table><tr><th>الشعبة</th><th>عدد الطلاب</th><th>الدروس المفتوحة</th><th></th></tr>${SEC.map(s=>`<tr><td><b>${s.name}</b></td><td>${STU.filter(x=>inSec(x,s.id)).length}</td><td>${(s.unlocked||[]).length} / ${T.length}</td><td><button class="btn r" data-del="${s.id}">حذف</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا توجد شعب بعد</td></tr>'}</table></div>`;
    $('#asec').onclick=async()=>{const n=$('#nsec').value.trim();if(!n)return;if(ok(await sb.from('sections').insert({name:n})))load()};
    $$('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('حذف الشعبة؟ (الطلاب يبقون بلا شعبة)')&&ok(await sb.from('sections').delete().eq('id',b.dataset.del)))load()});return}
  if(!SEC.length){v.innerHTML=`<div class="card notice">ابدئي بإضافة شعبة من تبويب «🏫 الشعب».</div>`;return}
  if(view==='students'){const list=STU.filter(s=>inSec(s,selSec)).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));
    v.innerHTML=`<div class="card"><h2>إضافة طلاب</h2><div class="row">الشعبة: ${secSel('sec')}</div><p class="muted">الصقي سطرًا لكل طالب: <b>الإيميل، الاسم</b> (الاسم اختياري)</p><textarea id="bulk" placeholder="student1@gmail.com, سارة أحمد&#10;student2@gmail.com, محمد علي"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="add">إضافة إلى الشعبة</button><span id="msg" class="muted"></span></div></div>
    <div class="card"><h2>طلاب شعبة ${secName(selSec)} (${list.length})</h2><table><tr><th>الاسم</th><th>الإيميل</th><th>الشعبة</th><th></th></tr>${list.map(s=>`<tr><td>${s.name||'—'}</td><td class="ltr">${s.email}</td><td><select data-mv="${s.email}">${SEC.map(x=>`<option value="${x.id}" ${x.id===s.section_id?'selected':''}>${x.name}</option>`).join('')}</select></td><td><button class="btn r" data-rm="${s.email}">حذف</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا يوجد طلاب في هذه الشعبة</td></tr>'}</table></div>`;
    $('#sec').onchange=e=>{selSec=e.target.value;render()};
    $('#add').onclick=async()=>{const rows=[];$('#bulk').value.split(/\n+/).map(l=>l.trim()).filter(Boolean).forEach(l=>{const [e,...nm]=l.split(/[,،\t]/);const em=(e||'').trim().toLowerCase();if(/^\S+@\S+\.\S+$/.test(em))rows.push({email:em,name:nm.join(' ').trim(),section_id:selSec})});if(!rows.length)return;if(ok(await sb.from('students').upsert(rows))){$('#msg').textContent=`تمت إضافة ${rows.length} طالب/ة ✓`;$('#bulk').value='';load()}};
    $$('[data-mv]').forEach(s=>s.onchange=async()=>{if(ok(await sb.from('students').update({section_id:s.value}).eq('email',s.dataset.mv)))load()});
    $$('[data-rm]').forEach(b=>b.onclick=async()=>{if(confirm('حذف الطالب/ة؟')&&ok(await sb.from('students').delete().eq('email',b.dataset.rm)))load()});return}
  if(view==='unlock'){const s=SEC.find(x=>x.id===selSec)||SEC[0];const un=s.unlocked||[];
    v.innerHTML=`<div class="card"><h2>فتح الدروس</h2><div class="row">الشعبة: ${secSel('sec')}<button class="btn g" id="cpy">تطبيق نفس الإعداد على كل الشعب</button></div><p class="muted">افتحي الموضوع بعد شرحه في المحاضرة. يظهر للطلاب خلال لحظات.</p>
     ${T.map((t,i)=>`<div class="tgl"><div><b>${i+1}. ${t.title}</b><div class="muted">${t.learn.length} درس · ${t.tasks.length} تحدٍّ</div></div><label class="sw2"><input type="checkbox" data-u="${t.id}" ${un.includes(t.id)?'checked':''}><span></span></label></div>`).join('')}</div>`;
    $('#sec').onchange=e=>{selSec=e.target.value;render()};
    $$('[data-u]').forEach(c=>c.onchange=async()=>{const set=new Set(un);c.checked?set.add(c.dataset.u):set.delete(c.dataset.u);if(ok(await sb.from('sections').update({unlocked:[...set]}).eq('id',s.id)))load()});
    $('#cpy').onclick=async()=>{if(!confirm('نسخ الدروس المفتوحة لهذه الشعبة إلى كل الشعب؟'))return;for(const x of SEC)await sb.from('sections').update({unlocked:un}).eq('id',x.id);load()};return}
  if(view==='track')renderTrack(v);
}
/* ================= المتابعة ================= */
let tmode='all',selT='',selI='',stuOpen=null;
const ITEMS=t=>(t.items&&t.items.map(i=>({...i,t:String(i.t).replace(/^\d+\.\s*/,'')})))||[...t.learn.map(k=>({k,t:k,g:'',n:0,x:0})),...t.tasks.map(k=>({k:k[0],t:k[1],g:'',n:0,x:1}))];
const DD=(p,t)=>p?.done?.[t.id]||{};
const stOf=(p,t,k)=>{const d=DD(p,t);const s=d.s?.[k]||null;const done=!!d.p?.[k];return {done,s,st:done?2:s&&((s.t||0)>0||(s.r||0)>0||(s.a||0)>0||(s.w||0)>0)?1:0}};
const fmtT=sec=>{sec=+sec||0;if(!sec)return '—';if(sec<60)return sec+' ث';const m=Math.round(sec/60);return m<60?m+' د':Math.floor(m/60)+' س '+(m%60)+' د'};
const fmtD=ts=>ts?new Date(ts).toLocaleString('ar',{dateStyle:'short',timeStyle:'short'}):'—';
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const topicPct=(p,t)=>{const it=ITEMS(t);const dn=it.filter(i=>stOf(p,t,i.k).done).length;return [dn,it.length]};
function renderTrack(v){const s=SEC.find(x=>x.id===selSec)||SEC[0];const un=s.unlocked||[];const TT=T.filter(t=>un.includes(t.id));const list=STU.filter(x=>inSec(x,s.id)).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));
  if(!selT||!T.find(t=>t.id===selT))selT=(TT[0]||T[0])?.id;const t=T.find(x=>x.id===selT);const its=t?ITEMS(t):[];if(!its.find(i=>i.k===selI))selI=its[0]?.k||'';
  const modes=`<div class="seg">${[['all','📋 عامة'],['topic','📚 حسب الموضوع'],['task','🎯 حسب المهمة']].map(([m,l])=>`<button data-tm="${m}" class="${tmode===m?'on':''}">${l}</button>`).join('')}</div>`;
  const tSel=`<select id="tsel">${T.map(x=>`<option value="${x.id}" ${x.id===selT?'selected':''}>${x.title}${un.includes(x.id)?'':' (مغلق)'}</option>`).join('')}</select>`;
  const iSel=`<select id="isel">${its.map((i,n)=>`<option value="${i.k}" ${i.k===selI?'selected':''}>${n+1}. ${esc(i.t)}</option>`).join('')}</select>`;
  let body='';
  if(!list.length)body=`<p class="empty">لا يوجد طلاب في هذه الشعبة — أضيفيهم من تبويب «👩‍🎓 الطلاب».</p>`;
  else if(tmode==='all'){
    let started=0,act=0,sum=0;const day=Date.now()-864e5;
    const rows=list.map(st=>{const p=PRO[st.email];let dn=0,tot=0;TT.forEach(t=>{const [a,b]=topicPct(p,t);dn+=a;tot+=b});const pc=tot?Math.round(dn/tot*100):0;sum+=pc;if(p&&Object.keys(p.done||{}).length)started++;if(p?.last&&new Date(p.last)>day)act++;
      return `<tr><td><a class="stu" data-stu="${st.email}">${esc(st.name||'—')}</a><div class="muted ltr" style="font-size:11.5px">${st.email}</div></td><td><div class="pbar"><i style="width:${pc}%"></i></div><small>${pc}%</small></td>${TT.map(t=>{const [a,b]=topicPct(p,t);return `<td><span class="chip c${a===0?0:a<b?1:2}">${a}/${b}</span></td>`}).join('')}<td class="muted">${fmtD(p?.last)}</td></tr>`}).join('');
    const hard=[];TT.forEach(t=>ITEMS(t).forEach((i,n)=>{let inp=0,w=0,dn=0;list.forEach(st=>{const o=stOf(PRO[st.email],t,i.k);if(o.st===1)inp++;if(o.done)dn++;if(o.s&&(o.s.w||o.s.ws))w++});if(inp||w)hard.push({t,i,n,inp,w,dn})}));hard.sort((a,b)=>(b.inp*2+b.w)-(a.inp*2+a.w));
    body=`<div class="kpis"><div><b>${list.length}</b><span>طالب/ة</span></div><div><b>${started}</b><span>بدؤوا العمل</span></div><div><b>${act}</b><span>نشِطون آخر 24 ساعة</span></div><div><b>${list.length?Math.round(sum/list.length):0}%</b><span>متوسط الإنجاز</span></div></div>
     ${hard.length?`<div class="card2"><h3>⚠️ مهام يتعثّر فيها الطلاب</h3>${hard.slice(0,6).map(h=>`<div class="hrow" data-go="${h.t.id}|${h.i.k}"><span><b>${esc(h.t.title)}</b> ← ${h.n+1}. ${esc(h.i.t)}</span><span class="muted">بدأ ولم ينهِ: <b>${h.inp}</b> · شاهد الحل: <b>${h.w}</b> · أنجز: <b>${h.dn}</b></span></div>`).join('')}</div>`:''}
     <div style="overflow:auto"><table><tr><th>الطالب/ة</th><th>الإنجاز</th>${TT.map(t=>`<th><a class="th" data-topic="${t.id}">${t.title}</a></th>`).join('')}<th>آخر دخول</th></tr>${rows}</table></div>`}
  else if(tmode==='topic'&&t){
    const groups=[];its.forEach((i,n)=>{const g=groups.at(-1);if(g&&g.g===i.g)g.c++;else groups.push({g:i.g,c:1})});
    const hasG=groups.some(g=>g.g);
    const cell=(p,i)=>{const o=stOf(p,t,i.k);const s=o.s||{};const tip=`${i.t}\nالوقت: ${fmtT(s.t)} · تحقّق: ${s.a||0} · أرني أين: ${s.h||0} · شاهد الحل: ${(s.w||0)+(s.ws||0)}`;const eye=(s.w||s.ws)?'<i class="eye">👁</i>':'';
      return `<td class="tc" title="${esc(tip)}">${o.done?`<span class="dot d2">✓</span>`:o.st?`<span class="dot d1">${s.n?(s.r||0)+'/'+s.n:'…'}</span>`:'<span class="dot d0"></span>'}${eye}</td>`};
    body=`<div class="row">الموضوع: ${tSel}<span class="muted">✓ أنجز · <span class="dot d1" style="display:inline-grid">2/5</span> بدأ (الخطوات المنجزة) · 👁 شاهد الحل · مرّري الماوس على الخانة للتفاصيل، واضغطي رقم المهمة لفتحها</span></div>
     <div style="overflow:auto"><table class="tt"><tr>${hasG?`<th rowspan="2">الطالب/ة</th><th rowspan="2">أنجز</th>${groups.map(g=>`<th colspan="${g.c}" class="gh">${esc(g.g)}</th>`).join('')}</tr><tr>`:'<th>الطالب/ة</th><th>أنجز</th>'}${its.map((i,n)=>`<th class="ih"><a class="th" data-item="${i.k}" title="${esc(i.t)}">${n+1}</a></th>`).join('')}</tr>
     ${list.map(st=>{const p=PRO[st.email];const [a,b]=topicPct(p,t);return `<tr><td><a class="stu" data-stu="${st.email}">${esc(st.name||st.email)}</a></td><td><span class="chip c${a===0?0:a<b?1:2}">${a}/${b}</span></td>${its.map(i=>cell(p,i)).join('')}</tr>`}).join('')}
     <tr class="foot"><td>عدد من أنجز</td><td></td>${its.map(i=>{const n=list.filter(st=>stOf(PRO[st.email],t,i.k).done).length;return `<td class="tc"><b>${n}</b><small>/${list.length}</small></td>`}).join('')}</tr></table></div>
     <ol class="legend">${its.map(i=>`<li><a class="th" data-item="${i.k}">${esc(i.t)}</a>${i.x?' <span class="chip c1" style="display:inline">تحدٍّ</span>':''}</li>`).join('')}</ol>`}
  else if(tmode==='task'&&t){const i=its.find(x=>x.k===selI);
    const R=list.map(stu=>{const o=stOf(PRO[stu.email],t,selI);return {stu,done:o.done,s:o.s,st:o.st}});const dn=R.filter(r=>r.st===2),ip=R.filter(r=>r.st===1),no=R.filter(r=>r.st===0);
    const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;const tms=dn.map(r=>r.s?.t||0).filter(Boolean);
    R.sort((a,b)=>b.st-a.st||(a.st===2?(a.s?.d||0)-(b.s?.d||0):(b.s?.r||0)-(a.s?.r||0)));
    const lab=['<span class="chip c0">لم يبدأ</span>','<span class="chip c1">بدأ ولم ينهِ</span>','<span class="chip c2">✓ أنجز</span>'];
    body=`<div class="row">الموضوع: ${tSel} المهمة: ${iSel}</div>
     <div class="kpis"><div class="k2"><b>${dn.length}</b><span>أنجزوا</span></div><div class="k1"><b>${ip.length}</b><span>بدؤوا ولم ينهوا</span></div><div class="k0"><b>${no.length}</b><span>لم يبدؤوا</span></div><div><b>${fmtT(avg(tms))}</b><span>متوسط وقت الإنجاز</span></div><div><b>${R.filter(r=>r.s&&(r.s.w||r.s.ws)).length}</b><span>شاهدوا الحل</span></div></div>
     <div style="overflow:auto"><table><tr><th>الطالب/ة</th><th>الحالة</th><th>الخطوات</th><th>الوقت</th><th>تحقّق</th><th>أرني أين</th><th>شاهد الحل</th><th>أول دخول</th><th>آخر نشاط</th><th>وقت الإنجاز</th></tr>
     ${R.map(r=>{const s=r.s||{};const n=s.n||i?.n||0;return `<tr><td><a class="stu" data-stu="${r.stu.email}">${esc(r.stu.name||r.stu.email)}</a></td><td>${lab[r.st]}</td><td>${n?`<div class="pbar" style="min-width:60px"><i style="width:${Math.round((r.done?n:(s.r||0))/n*100)}%"></i></div><small>${r.done?n:(s.r||0)}/${n}</small>`:'—'}</td><td>${fmtT(s.t)}</td><td>${s.a||0}</td><td>${s.h||0}</td><td>${(s.w||0)+(s.ws||0)?`👁 ${(s.w||0)} كامل · ${(s.ws||0)} خطوة`:'0'}</td><td class="muted">${fmtD(s.f)}</td><td class="muted">${fmtD(s.l)}</td><td class="muted">${fmtD(s.d)}</td></tr>`}).join('')}</table></div>
     <p class="muted">«الخطوات» = عدد بنود المهمة المحقّقة. «شاهد الحل» = مرات تشغيل الحل الكامل أو حل خطوة واحدة. التفاصيل الدقيقة (الوقت والمحاولات) تُسجَّل من الآن فصاعدًا.</p>`}
  v.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">متابعة شعبة ${s.name}</h2><div class="row" style="margin:0">الشعبة: ${secSel('sec')}<button class="btn g" id="rf">↻ تحديث</button><button class="btn g" id="csv">نسخ الجدول (CSV)</button></div></div>${modes}
    ${!TT.length?'<p class="notice">لم تفتحي أي موضوع لهذه الشعبة بعد — من تبويب «🔓 فتح الدروس».</p>':''}${body}</div>${stuOpen?stuHTML(stuOpen,TT):''}`;
  $('#sec').onchange=e=>{selSec=e.target.value;render()};$('#rf').onclick=load;
  $$('[data-tm]').forEach(b=>b.onclick=()=>{tmode=b.dataset.tm;render()});
  $('#tsel')&&($('#tsel').onchange=e=>{selT=e.target.value;selI='';render()});$('#isel')&&($('#isel').onchange=e=>{selI=e.target.value;render()});
  $$('[data-topic]').forEach(a=>a.onclick=()=>{selT=a.dataset.topic;tmode='topic';render()});
  $$('[data-item]').forEach(a=>a.onclick=()=>{selI=a.dataset.item;tmode='task';render()});
  $$('[data-go]').forEach(a=>a.onclick=()=>{const [x,y]=a.dataset.go.split('|');selT=x;selI=y;tmode='task';render()});
  $$('[data-stu]').forEach(a=>a.onclick=()=>{stuOpen=a.dataset.stu;render()});
  $('#mx')&&($('#mx').onclick=()=>{stuOpen=null;render()});$('#mbg')&&($('#mbg').onclick=e=>{if(e.target.id==='mbg'){stuOpen=null;render()}});
  $('#csv').onclick=()=>{let rows;if(tmode==='task'&&t){rows=[['الاسم','الإيميل','الحالة','الخطوات','الوقت (د)','تحقق','أرني أين','شاهد الحل']];list.forEach(st=>{const o=stOf(PRO[st.email],t,selI);const q=o.s||{};rows.push([st.name||'',st.email,['لم يبدأ','بدأ','أنجز'][o.st],(o.done?q.n:(q.r||0))+'/'+(q.n||''),Math.round((q.t||0)/60),q.a||0,q.h||0,(q.w||0)+(q.ws||0)])})}
    else if(tmode==='topic'&&t){rows=[['الاسم','الإيميل',...its.map(i=>i.t)]];list.forEach(st=>{const p=PRO[st.email];rows.push([st.name||'',st.email,...its.map(i=>{const o=stOf(p,t,i.k);return o.done?'✓':o.st?((o.s?.r||0)+'/'+(o.s?.n||'')):''})])})}
    else{rows=[['الاسم','الإيميل',...TT.map(t=>t.title)]];list.forEach(st=>{const p=PRO[st.email];rows.push([st.name||'',st.email,...TT.map(t=>topicPct(p,t).join('/'))])})}
    navigator.clipboard.writeText(rows.map(r=>r.map(c=>/[,"\n]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(',')).join('\n')).then(()=>alert('تم النسخ — الصقيه في Excel'))};
}
function stuHTML(em,TT){const st=STU.find(x=>x.email===em);const p=PRO[em];if(!st)return '';
  return `<div class="mbg" id="mbg"><div class="mdl"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(st.name||em)}</h2><button class="btn g" id="mx">✕ إغلاق</button></div><div class="muted ltr">${em} · آخر دخول: ${fmtD(p?.last)}</div>
   ${TT.map(t=>{const [a,b]=topicPct(p,t);return `<h3>${t.title} <span class="chip c${a===0?0:a<b?1:2}">${a}/${b}</span></h3><table class="mini"><tr><th>المهمة</th><th>الحالة</th><th>الخطوات</th><th>الوقت</th><th>تحقّق</th><th>أرني</th><th>شاهد</th><th>آخر نشاط</th></tr>${ITEMS(t).map((i,n)=>{const o=stOf(p,t,i.k),s=o.s||{};return `<tr class="r${o.st}"><td>${n+1}. ${esc(i.t)}</td><td>${['—','بدأ','✓'][o.st]}</td><td>${s.n?(o.done?s.n:(s.r||0))+'/'+s.n:''}</td><td>${fmtT(s.t)}</td><td>${s.a||''}</td><td>${s.h||''}</td><td>${(s.w||0)+(s.ws||0)||''}</td><td class="muted">${fmtD(s.l)}</td></tr>`}).join('')}</table>`}).join('')||'<p class="empty">لا توجد مواضيع مفتوحة</p>'}</div></div>`}

init();
</script>
</body>
</html>
